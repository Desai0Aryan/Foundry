global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: foundry-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Docker DNS returns one A record per replica, so `--scale worker=N` is picked up
  # automatically (re-resolved every refresh_interval).
  - job_name: foundry-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 5s

  - job_name: foundry-relay
    static_configs:
      - targets: ["relay:9101"]

  - job_name: foundry-reaper
    static_configs:
      - targets: ["reaper:9102"]
