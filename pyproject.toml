[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "foundry"
version = "0.5.0"
description = "Foundry: a production-style distributed job processing platform (Postgres + RabbitMQ + Redis)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "orjson>=3.10",
  "aio-pika>=9.4",
  "redis>=5.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
tools = ["httpx>=0.27"]  # `foundry loadtest` / `foundry chaos`
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
foundry = "foundry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not chaos'"
markers = [
  "integration: needs a running PostgreSQL (FOUNDRY_TEST_DATABASE_URL)",
  "broker: also needs RabbitMQ (FOUNDRY_TEST_BROKER_URL)",
  "chaos: spawns real processes and kills them; slow (run with -m chaos)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"src/foundry/ratelimit.py" = ["S105"]  # Lua scripts, not passwords

"src/foundry/audit.py" = ["E501", "S608"]  # scope fragments are static, values are bound
"src/foundry/tools/**" = ["E501", "S311", "S110", "BLE001", "S603"]
"src/foundry/handlers.py" = ["E501"]
"scripts/**" = ["S603", "S607", "E501", "S311", "S310", "S603", "S607", "RUF059", "B007"]
"ops/**" = ["E501", "RUF012"]
"tests/**" = ["S105", "S106", "E501", "ASYNC109", "ASYNC220", "S603"]
