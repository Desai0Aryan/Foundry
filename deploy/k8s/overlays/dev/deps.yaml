# Throwaway PostgreSQL / Redis / RabbitMQ for kind/minikube. In production use managed services.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: foundry, labels: { app.kubernetes.io/part-of: foundry-deps } }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres, app.kubernetes.io/part-of: foundry-deps } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: foundry }
            - { name: POSTGRES_PASSWORD, value: CHANGE_ME }
            - { name: POSTGRES_DB, value: foundry }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, foundry] }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: foundry }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: foundry, labels: { app.kubernetes.io/part-of: foundry-deps } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis, app.kubernetes.io/part-of: foundry-deps } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe: { exec: { command: [redis-cli, ping] }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: foundry }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: rabbitmq, namespace: foundry, labels: { app.kubernetes.io/part-of: foundry-deps } }
spec:
  serviceName: rabbitmq
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq, app.kubernetes.io/part-of: foundry-deps } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-alpine
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: foundry }
            - { name: RABBITMQ_DEFAULT_PASS, value: CHANGE_ME }
          ports: [{ containerPort: 5672 }]
          readinessProbe: { exec: { command: [rabbitmq-diagnostics, -q, ping] }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: foundry }
spec: { selector: { app: rabbitmq }, ports: [{ port: 5672 }] }
