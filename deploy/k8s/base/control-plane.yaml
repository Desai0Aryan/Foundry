# Relay and reaper claim work with FOR UPDATE SKIP LOCKED, so running two of each is safe:
# it is high availability, not double processing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundry-relay
  namespace: foundry
  labels: { app.kubernetes.io/name: foundry, app.kubernetes.io/component: relay }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: foundry, app.kubernetes.io/component: relay }
  template:
    metadata:
      labels: { app.kubernetes.io/name: foundry, app.kubernetes.io/component: relay }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9101" }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: relay
          image: foundry:latest
          imagePullPolicy: IfNotPresent
          command: ["foundry", "relay"]
          ports: [{ name: metrics, containerPort: 9101 }]
          envFrom:
            - configMapRef: { name: foundry-config }
            - secretRef: { name: foundry-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundry-reaper
  namespace: foundry
  labels: { app.kubernetes.io/name: foundry, app.kubernetes.io/component: reaper }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: foundry, app.kubernetes.io/component: reaper }
  template:
    metadata:
      labels: { app.kubernetes.io/name: foundry, app.kubernetes.io/component: reaper }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9102" }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: reaper
          image: foundry:latest
          imagePullPolicy: IfNotPresent
          command: ["foundry", "reaper"]
          ports: [{ name: metrics, containerPort: 9102 }]
          envFrom:
            - configMapRef: { name: foundry-config }
            - secretRef: { name: foundry-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 15
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: foundry-control-plane
  namespace: foundry
spec:
  minAvailable: 1
  selector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [relay, reaper] }
