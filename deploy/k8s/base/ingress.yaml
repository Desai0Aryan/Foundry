apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foundry
  namespace: foundry
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: foundry.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: foundry-api, port: { name: http } } } }
