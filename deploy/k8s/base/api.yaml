apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundry-api
  namespace: foundry
  labels: { app.kubernetes.io/name: foundry, app.kubernetes.io/component: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: foundry, app.kubernetes.io/component: api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: foundry, app.kubernetes.io/component: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: foundry, app.kubernetes.io/component: api }
      containers:
        - name: api
          image: foundry:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: foundry-config }
            - secretRef: { name: foundry-secrets }
          resources:
            requests: { cpu: 250m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }  # checks PostgreSQL
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }  # let endpoints propagate before SIGTERM
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: foundry-api
  namespace: foundry
  labels: { app.kubernetes.io/name: foundry, app.kubernetes.io/component: api }
spec:
  selector: { app.kubernetes.io/name: foundry, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: foundry-api
  namespace: foundry
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: foundry-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: foundry-api
  namespace: foundry
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: foundry, app.kubernetes.io/component: api }
