# One command brings up the whole platform:   docker compose up --build
name: foundry

x-env: &env
  FOUNDRY_DATABASE_URL: postgresql://foundry:foundry@postgres:5432/foundry
  FOUNDRY_BROKER_URL: amqp://guest:guest@rabbitmq:5672/
  FOUNDRY_REDIS_URL: redis://redis:6379/0
  FOUNDRY_LEASE_SECONDS: ${FOUNDRY_LEASE_SECONDS:-10}      # crash recovery latency
  FOUNDRY_HEARTBEAT_SECONDS: ${FOUNDRY_HEARTBEAT_SECONDS:-3}
  FOUNDRY_BACKOFF_BASE_SECONDS: ${FOUNDRY_BACKOFF_BASE_SECONDS:-2}
  FOUNDRY_ADMIN_TOKEN: ${FOUNDRY_ADMIN_TOKEN:-dev-admin-token-change-me}
  FOUNDRY_API_KEY_PEPPER: ${FOUNDRY_API_KEY_PEPPER:-dev-pepper-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Rate-limit buckets and daily-quota counters. Losing it is safe: counters are reseeded
  # from PostgreSQL and the limiter fails open.
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"] # 15672 = management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build: .
    environment: *env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # PostgreSQL -> RabbitMQ (transactional outbox). Safe to run more than one.
  relay:
    build: .
    command: ["foundry", "relay"]
    environment: *env
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # Lease recovery, retry promotion, redrive. Stateless; safe to run more than one.
  reaper:
    build: .
    command: ["foundry", "reaper"]
    environment: *env
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }

  # The worker fleet. Scale freely:  docker compose up -d --scale worker=6
  worker:
    build: .
    command: ["foundry", "worker"]
    environment:
      <<: *env
      FOUNDRY_WORKER_CONCURRENCY: ${FOUNDRY_WORKER_CONCURRENCY:-4}
    restart: unless-stopped
    stop_grace_period: 30s # lets running jobs finish on `docker compose stop`
    deploy:
      replicas: 3
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # ---- observability ------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"] # http://localhost:3000  (admin / admin, anonymous viewing enabled)
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/foundry.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  pgdata:
