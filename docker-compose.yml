# One command brings up the whole platform:   docker compose up --build
name: foundry

x-env: &env
  FOUNDRY_DATABASE_URL: postgresql://foundry:foundry@postgres:5432/foundry
  FOUNDRY_BROKER_URL: amqp://guest:guest@rabbitmq:5672/
  FOUNDRY_LEASE_SECONDS: ${FOUNDRY_LEASE_SECONDS:-10}      # crash recovery latency
  FOUNDRY_HEARTBEAT_SECONDS: ${FOUNDRY_HEARTBEAT_SECONDS:-3}
  FOUNDRY_BACKOFF_BASE_SECONDS: ${FOUNDRY_BACKOFF_BASE_SECONDS:-2}
  FOUNDRY_ADMIN_TOKEN: ${FOUNDRY_ADMIN_TOKEN:-dev-admin-token-change-me}
  FOUNDRY_API_KEY_PEPPER: ${FOUNDRY_API_KEY_PEPPER:-dev-pepper-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Used from Part 3 (rate limiting / quotas); defined now so the topology is stable.
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"] # 15672 = management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build: .
    environment: *env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  # PostgreSQL -> RabbitMQ (transactional outbox). Safe to run more than one.
  relay:
    build: .
    command: ["foundry", "relay"]
    environment: *env
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # Lease recovery, retry promotion, redrive. Stateless; safe to run more than one.
  reaper:
    build: .
    command: ["foundry", "reaper"]
    environment: *env
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }

  # The worker fleet. Scale freely:  docker compose up -d --scale worker=6
  worker:
    build: .
    command: ["foundry", "worker"]
    environment:
      <<: *env
      FOUNDRY_WORKER_CONCURRENCY: ${FOUNDRY_WORKER_CONCURRENCY:-4}
    restart: unless-stopped
    stop_grace_period: 30s # lets running jobs finish on `docker compose stop`
    deploy:
      replicas: 3
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata:
